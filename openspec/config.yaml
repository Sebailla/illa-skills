strict_tdd: false
context: |
  illa-skills is a SKILLS & DOCUMENTATION repository (no application code).
  Detected project marker: package.template-pi.json (pi-extensions template) and mcp.json (context7 + engram).
  Stack: Markdown-first, Pi/opencode runtime, MCP servers (context7, engram), GitHub remote Sebailla/illa-skills.
  Architecture: LLM-first skills + el-Gentleman persona profile (AGENTS.md, bilingual ES/EN).
  Git workflow (per estrategia-git/SKILL.md v3.0): main ← develop ← feat/* | fix/* | docs/*; conventional commits, no AI attribution.
  Test-like artifacts: 8 markdown files in ui-ux-developer/TESTS/ are EXAMPLE test code for skill consumers (NOT runnable in this repo).
  No real test runner, linter, type checker, formatter, or CI is installed at the repo root.
  Project-local skills: estrategia-git (v3.0, router index ~46 lines) + 5 dedicated SKILL.md at repo root (commit-conventions, branch-naming, pr-template, release-flow, git-tooling-integration), ui-ux-developer (v1.6.3), el-gentleman (user-profile).
